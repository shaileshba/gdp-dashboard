[project]
name = "gdp-dashboard"
version = "0.1.0"
description = "500 years of world GDP plus a 100-year scenario simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline"]

[tool.ruff]
line-length = 120
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
