[project]
name = "gdp-dashboard"
version = "0.1.0"
description = "500 years of world GDP plus a 100-year scenario simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "requests>=2.32",
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "api/tests"]
pythonpath = ["pipeline", "."]

[tool.ruff]
line-length = 120
src = ["pipeline", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
